apiVersion: "core.oam.dev/v1beta1"
kind: "Application"
metadata:
  name: "{{APP_ID}}"
spec:
  components:
    - name: "dummy-app-controller"
      type: "webservice"
      properties:
        image: "rsprat/dummy-rest-app-controller:v1"
        cpu: "3.0"
        memory: "3048Mi"
        imagePullPolicy: "Always"
        exposeType: NodePort
        ports:
          - name: controller-api
            expose: true
            port: 8000
            nodePort: 30008
            protocol: TCP
        env:
          - name: "report_metrics_to_ems"
            value: "True"
          - name: "nebulous_ems_ip"
            valueFrom:
              fieldRef:
                fieldPath: status.hostIP
          - name: "nebulous_ems_port"
            value: "61610"
          - name: "nebulous_ems_user"
            value: "aaa"
          - name: "nebulous_ems_password"
            value: "111"
      traits:
        - type: "scaler"
          properties:
            replicas: 1
        - type: "annotations"
          properties:
            "nebulous-placement-constraint":  "CLOUD"
    - name: "dummy-app-worker"
      type: "webservice"
      properties:
        image: "rsprat/dummy-rest-app-worker:v1"
        cpu: "3.0"
        memory: "3048Mi"
        imagePullPolicy: "Always"
        env:
          - name: API_ADDRESS
            value: http://dummy-app-controller:8000
      traits:
        - type: "scaler"
          properties:
            replicas: 1
        - type: "annotations"
          properties:
            "nebulous-placement-constraint":  "CLOUD"
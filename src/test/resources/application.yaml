qpid-jms:
  url:  '${NEBULOUS_BROKER_URL:amqp://localhost:5672}'
  address: '${NEBULOUS_BROKER_ADDRESS:localhost}'
  port: '${NEBULOUS_BROKER_PORT:5672}'
  username: '${NEBULOUS_BROKER_USERNAME:admin}'
  password: '${NEBULOUS_BROKER_PASSWORD:nebulous}'

jms:
  topic:
    mock:
      inbound: 'jms.todo.inbound'
      report: 'jms.todo.report'
      map: 'jms.todo.map'
    nebulous:
      optimiser: 'eu.nebulouscloud.ui.dsl.generic'
      metric_model: 'eu.nebulouscloud.ui.dsl.metric_model'
      evaluator: 'eu.nebulouscloud.optimiser.utilityevaluator.performanceindicators'
      node_canditates_request_cfsb: 'eu.nebulouscloud.cfsb.get_node_candidates_multi'
      node_canditates_request_sal: 'eu.nebulouscloud.exn.sal.nodecandidate.get'
      node_canditates_reply_sal: 'eu.nebulouscloud.exn.sal.nodecandidate.get.reply'
      node_canditates_reply_cfsb: 'eu.nebulouscloud.cfsb.get_node_candidates_multi.reply'
      optimiser_define_cluster: 'eu.nebulouscloud.exn.sal.cluster.define'
      optimiser_deploy_cluster: 'eu.nebulouscloud.exn.sal.cluster.deploy'
      optimiser_controller_state: 'eu.nebulouscloud.optimiser.controller.app_state'
      sal_node_create: "eu.nebulouscloud.exn.sal.node.create"



sal:
  api:
    url: '${SAL_API_URL:http://localhost:8080}'
    username: '${SAL_API_USER}'
    password: '${SAL_API_USER}'

resource_manager:
  url: '${RESOURCE_MANAGER_URL}'
  username: '${RESOURCE_MANAGER_USERNAME}'
  password: '${RESOURCE_MANAGER_PASSWORD}'

onm_url: '${ONM_URL}'

cloud_resources:
  uuid: '${CLOUD_RESOURCES_UUID}'
  title: '${CLOUD_RESOURCES_TITLE}'
  platform: '${CLOUD_RESOURCES_PLATFORM}'
  enabled: '${CLOUD_RESOURCES_ENABLED}'
  regions: '${CLOUD_RESOURCES_REGIONS}'
  use_registered: '${CLOUD_RESOURCES_USE_REGISTERED}'
  secret: '${CLOUD_RESOURCES_SECRET}'

docker:
  server: '${PRIVATE_DOCKER_REGISTRY_SERVER}'
  username: '${PRIVATE_DOCKER_REGISTRY_USERNAME}'
  password: '${PRIVATE_DOCKER_REGISTRY_PASSWORD}'
  email: '${PRIVATE_DOCKER_REGISTRY_EMAIL}'

app:
  files:
    creation_message: '${APP_CREATION_MESSAGE:app_creation_files/app_creation_message.json}'
    kubevela: '${KUBEVELA_FILE:app_creation_files/kubevela.yaml}'
    metric_model: '${METRIC_MODEL:app_creation_files/metric_model.json}'
    cloud_registration: '${CLOUD_REGISTRATION:app_creation_files/os_registration.json}'
  ems:
    username: '${APP_EMS_USER}'
    password: '${APP_EMS_PASSWORD}'